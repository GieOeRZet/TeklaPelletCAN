name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nazwa wydania (np. v0.3.0): publikuje kanał STABILNY i tworzy GitHub Release (tag powstaje po stronie GitHuba). Puste = zwykły przebieg."
        required: false
        default: ""
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tabele wygenerowane aktualne
        run: python3 tools/gen_points.py --check && python3 tools/sync_web.py --check
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Testy rdzenia (host)
        run: cmake -S firmware/test -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
  idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Kompilacja ESP-IDF (esp32c6)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          . $IDF_PATH/export.sh
          export TPC_VERSION="$(cat VERSION)+${RUN_NUMBER}"
          cd firmware
          idf.py set-target esp32c6
          idf.py build
          (cd build && python -m esptool --chip esp32c6 merge_bin -o ../teklapelletcan-factory.bin @flash_args)
      - name: Podpis OTA (klucz z sekretu OTA_SIGNING_KEY, a bez niego klucz testowy)
        env:
          KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          . $IDF_PATH/export.sh
          pip install -q cryptography
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > /tmp/ota.pem; else cp tools/dev-keys/ota-dev-private.pem /tmp/ota.pem; echo "UWAGA: podpis kluczem TESTOWYM"; fi
          python3 tools/ota_sign.py sign --key /tmp/ota.pem --bin firmware/build/teklapelletcan.bin       # .sig (zgodność wsteczna)
          cp firmware/build/teklapelletcan.bin.sig .
          cp firmware/build/teklapelletcan.bin teklapelletcan-raw.bin   # surowy obraz: razem z .sig dla starych wersji (0.2.x), które nie znają podpisu wbudowanego
          python3 tools/ota_sign.py package --key /tmp/ota.pem --bin firmware/build/teklapelletcan.bin --out teklapelletcan.bin   # plik z podpisem w środku
          rm -f /tmp/ota.pem
      - uses: actions/upload-artifact@v4
        with:
          name: teklapelletcan-firmware
          path: |
            firmware/teklapelletcan-factory.bin
            teklapelletcan.bin
            teklapelletcan-raw.bin
            teklapelletcan.bin.sig
          retention-days: 30
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - run: cmake -S firmware/test -B build-host && cmake --build build-host
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright
        run: |
          cd web/test && npm init -y >/dev/null && npm i playwright >/dev/null && npx playwright install --with-deps chromium
      - name: Test UI urzadzenia (portal, ustawienia, OTA, logi) w przegladarce
        run: |
          pip install -q cryptography
          mkdir -p /tmp/ota && python3 - <<'PY'
          import sys; sys.path.insert(0,'tools')
          from pathlib import Path
          import ota_sign as O
          key=O.load('tools/dev-keys/ota-dev-private.pem')
          h=bytearray(24); h[0]=0xE9; h[12]=13
          img=bytes(h)+bytes((i*7+3)&0xFF for i in range(20000))
          Path('/tmp/ota/good.bin').write_bytes(img); Path('/tmp/ota/good.sig').write_text(O.sign_image(key,img)+"\n")
          Path('/tmp/ota/good.pkg.bin').write_bytes(img + O.TRAILER_MAGIC + bytes.fromhex(O.sign_image(key,img)))
          bad=bytearray(img); bad[5000]^=1; Path('/tmp/ota/tampered.bin').write_bytes(bytes(bad))
          PY
          build-host/sim_server 8102 web & sleep 15
          cd web/test && NODE_PATH=$PWD/node_modules node e2e_device_ui.js http://127.0.0.1:8102 /tmp/ota
      - name: Test aplikacji Android – powłoka i tryb DEMO (wirtualne urządzenie z rdzenia firmware)
        run: |
          build-host/demo_server 8098 web & sleep 3
          cd android/test && NODE_PATH=$PWD/../../web/test/node_modules node e2e_app.js ../ui ../../web http://127.0.0.1:8098 /tmp
          pkill demo_server || true; cd ../..
          build-host/demo_server 8099 android/ui & sleep 3
          cd android/test && NODE_PATH=$PWD/../../web/test/node_modules node e2e_ui.js http://127.0.0.1:8099 /tmp
  # Aplikacja Android: ten sam rdzeń C++ co firmware (tryb demo, JNI) + strony urządzenia (web/) w paczce. Podpis kluczem z sekretów
  # (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); bez nich – klucz TESTOWY z repozytorium.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle (pobranie dystrybucji z ponowieniami – GitHub bywa chwilowo niedostępny)
        run: |
          cd android && chmod +x gradlew
          ok=0; for i in 1 2 3 4 5; do if ./gradlew --no-daemon --version; then ok=1; break; fi; echo "próba $i nieudana – ponawiam"; sleep 30; done; [ "$ok" = 1 ]
      - name: Testy logiki aplikacji na JVM (blokada zapisu, PIN, cache, proxy)
        run: |
          cd android
          ok=0; for i in 1 2 3 4 5 6; do if ./gradlew --no-daemon -p jvmtest run; then ok=1; break; fi; echo "próba $i nieudana (np. chwilowy błąd pobierania) – ponawiam"; sleep 45; done; [ "$ok" = 1 ]
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Licencje SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Budowa APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.jks; export ANDROID_KEYSTORE_FILE=/tmp/release.jks; echo prod > signing.txt; else echo "UWAGA: podpis kluczem TESTOWYM"; echo dev > signing.txt; fi
          cd android && chmod +x gradlew
          ok=0; for i in 1 2 3 4 5 6; do if ./gradlew --no-daemon assembleRelease assembleDebug; then ok=1; break; fi; echo "próba $i nieudana (np. chwilowy błąd pobierania) – ponawiam"; sleep 45; done; [ "$ok" = 1 ]
          cp app/build/outputs/apk/release/app-release.apk ../teklapelletcan.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../teklapelletcan-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teklapelletcan-apk
          path: |
            teklapelletcan.apk
            signing.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: teklapelletcan-debug-apk
          path: teklapelletcan-debug.apk
          retention-days: 7
  # Test dymny aplikacji na prawdziwym emulatorze Androida (prawdziwy WebView, JNI, tryb demo). Zrzuty ekranu trafiają na gałąź ci-screens.
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: teklapelletcan-debug-apk
          path: debugapk
      - name: Włącz KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator Android 34 + test dymny
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/test/emulator_smoke.sh debugapk/teklapelletcan-debug.apk /tmp/shots
      - name: Wynik testu
        if: always()
        run: cat /tmp/shots/wynik.txt || true
      - name: Publikuj zrzuty na gałęzi ci-screens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d /tmp/shots ] || exit 0
          mkdir -p /tmp/shots_pub && cp -r /tmp/shots/. /tmp/shots_pub/
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan shots
          git rm -rf . -q
          cp -r /tmp/shots_pub/. .
          echo "run ${{ github.run_number }} sha ${{ github.sha }}" > INFO.txt
          git add -A
          git commit -qm "Zrzuty z emulatora: przebieg ${{ github.run_number }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots:ci-screens --force
  ha-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Symulator urzadzenia (host)
        run: cmake -S firmware/test -B build-host && cmake --build build-host
      - name: Testy integracji Home Assistant
        run: |
          pip install pytest-homeassistant-custom-component
          python -m pytest -q

  # Publikacja aktualizacji OTA dla przycisku „Sprawdź aktualizacje” w ustawieniach urządzenia.
  # Pliki trafiają na gałąź `updates` (serwowane przez raw.githubusercontent.com z CORS *): tag v* = kanał stable, reszta = beta.
  publish-updates:
    needs: [host-tests, idf-build, web-ui, ha-integration]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: publish-updates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: teklapelletcan-firmware
          path: art
      - name: Publikuj na galezi updates
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          CHANNEL=beta; case "$REF" in refs/tags/v*) CHANNEL=stable;; esac; [ -n "$RELEASE_TAG" ] && CHANNEL=stable
          APPARG=""; if [ "$CHANNEL" = stable ]; then APPARG="--app-tag ${RELEASE_TAG:-${REF#refs/tags/}} --repo ${GITHUB_REPOSITORY}"; fi
          git fetch origin updates:updates 2>/dev/null && git worktree add /tmp/upd updates || { mkdir -p /tmp/upd && git -C /tmp/upd init -q -b updates && git -C /tmp/upd remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; }
          mkdir -p /tmp/upd/$CHANNEL
          cp art/teklapelletcan.bin /tmp/upd/$CHANNEL/teklapelletcan.bin
          cp art/teklapelletcan.bin.sig /tmp/upd/$CHANNEL/teklapelletcan.bin.sig
          NOTES="$(git log -1 --pretty=%s "$SHA")"
          # changelog = komunikaty commitów od poprzedniego opublikowanego wydania tego kanału (max 15)
          PREV="$(python3 -c "import json;print(json.load(open('/tmp/upd/manifest.json'))['channels']['$CHANNEL']['commit'])" 2>/dev/null || true)"
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then CHG="$(git log --pretty=%s "$PREV..$SHA" | head -15)"; else CHG="$(git log --pretty=%s -n 10 "$SHA")"; fi
          python3 tools/make_manifest.py --dir /tmp/upd --channel $CHANNEL --version "$(cat VERSION)" --build "$RUN_NUMBER" --commit "$SHA" --notes "$NOTES" --changelog "$CHG" --embedded $APPARG
          cd /tmp/upd
          FULL="$(python3 -c "import json;print(json.load(open('manifest.json'))['channels']['$CHANNEL']['full'])")"
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan snapshot          # jedna migawka bez historii: gałąź nie rośnie o kolejne pliki 1,4 MB
          git add -A
          git commit -q -m "Aktualizacja $CHANNEL: $FULL"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" snapshot:updates --force

  # GitHub Release przy tagu v*: HACS instaluje integrację z wydania; w załącznikach firmware do ręcznego wgrania.
  github-release:
    needs: [host-tests, idf-build, web-ui, ha-integration, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: teklapelletcan-firmware
          path: art
      - uses: actions/download-artifact@v4
        with:
          name: teklapelletcan-apk
          path: art
      - name: Zabezpieczenie – APK z wydania musi być podpisany kluczem produkcyjnym
        run: |
          if [ "$(cat art/signing.txt)" != "prod" ]; then
            echo "::error::APK jest podpisany kluczem TESTOWYM. Ustaw sekrety ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (docs/APLIKACJA_ANDROID.md) – inaczej pierwsza aktualizacja aplikacji wymagałaby jej odinstalowania."
            exit 1
          fi
      - name: Utworz wydanie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## TeklaPelletCAN $TAG"
            echo
            echo "- **Firmware:** \`teklapelletcan.bin\` (podpis ECDSA wbudowany w plik; osobny \`.sig\` tylko dla zgodności), \`teklapelletcan-factory.bin\` (pełny obraz do wgrania kablem od adresu 0x0)."
            echo "- **Aplikacja Android:** \`teklapelletcan.apk\` (Android 10+; wyszukuje urządzenia w sieci, ma tryb demo)."
            echo "- **Integracja Home Assistant:** HACS → Integracje → ⋮ → Własne repozytoria → \`https://github.com/${GITHUB_REPOSITORY}\` (Integracja)."
            echo "- **Aktualizacja urządzenia:** strona urządzenia → Ustawienia → Aktualizacja oprogramowania → kanał stabilny."
            echo
            echo "### Zmiany"
            git log --pretty='- %s' $RANGE | head -40
          } > notes.md
          mapfile -t FILES < <(find art -type f \( -name 'teklapelletcan*.bin' -o -name 'teklapelletcan*.sig' -o -name 'teklapelletcan*.apk' \) | sort)
          echo "zalaczniki: ${FILES[*]}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "TeklaPelletCAN $TAG" --notes-file notes.md "${FILES[@]}"
