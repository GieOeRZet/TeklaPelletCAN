name: TeklaPellet NEW APP

on:
  push:
    branches: [android-new-app]
    paths:
      - 'new_app/**'
      - '.github/workflows/new-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build NEW APK
        run: gradle -p new_app :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeklaPellet-NEW-debug
          path: new_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for smoke
        run: gradle -p new_app :app:assembleDebug --no-daemon
      - name: Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r new_app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n pl.gieoerzet.teklapelletcan.newapp/.MainActivity
            sleep 6
            test -n "$(adb shell pidof pl.gieoerzet.teklapelletcan.newapp)"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity.*pl.gieoerzet.teklapelletcan.newapp/.MainActivity' || adb shell dumpsys activity activities | grep -q 'pl.gieoerzet.teklapelletcan.newapp'
            adb exec-out screencap -p > new_app_smoke.png
      - name: Capture emulator diagnostics
        if: always()
        run: |
          adb devices -l > adb_devices.txt || true
          adb logcat -d -t 1500 > new_app_logcat.txt || true
          adb shell dumpsys window windows > new_app_windows.txt || true
          adb shell dumpsys activity activities > new_app_activities.txt || true
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeklaPellet-NEW-smoke
          path: |
            new_app_smoke.png
            adb_devices.txt
            new_app_logcat.txt
            new_app_windows.txt
            new_app_activities.txt
          if-no-files-found: warn
