<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Karta z oryginalu (SVG/CSS + bitmapa kotla)</title>
<style>
:root{--tile-top:#525152;--tile-bot:#313031;--ic:#e8e8ec;--led:#a5d710;--cond:"Inter Display","Inter","Carlito","DejaVu Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;height:100%}body{display:grid;place-items:center}
#card{position:relative;width:480px;height:272px;background:#000;overflow:hidden;font-family:var(--cond);color:#fff}
.t{position:absolute;white-space:nowrap;font-stretch:condensed}
.time{left:20px;top:5px;font-size:18px;line-height:24px;font-weight:300}
.day{left:0;width:480px;top:5px;text-align:center;font-size:19px;line-height:24px;font-weight:300}
#boiler{position:absolute;left:35px;top:38px;width:82px;height:145px;image-rendering:auto}
.big{left:150px;width:230px;top:30px;text-align:center;font-size:104px;line-height:110px;font-weight:200;letter-spacing:-2px;transform:scaleX(.9);transform-origin:center}
.state{left:159px;width:200px;top:134px;text-align:center;font-size:35px;line-height:40px;font-weight:300;transform:scaleX(.92)}
/* kapsula */
.pill{position:absolute;left:349px;top:59px;width:131px;height:35px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,#6d686d 0%,#5f5d5f 25%,#4d4d4d 60%,#424142 100%);box-shadow:inset 0 1px 0 #7d7a7d,0 0 0 1px #0b0b0b}
.pill .n{position:absolute;left:15px;top:-6px;font-size:46px;line-height:52px;font-weight:200;transform:scaleX(.82);transform-origin:left}
.pill .a{position:absolute;left:53px;top:8px;width:27px;height:11px;border-radius:2.5px;background:#fff;color:#000;font-size:10px;line-height:11px;font-weight:600;text-align:center;letter-spacing:-.2px;transform-origin:center;font-stretch:condensed}
/* belka */
.tile{position:absolute;top:197px;width:68px;height:75px;background:linear-gradient(180deg,#525152 0,#4e4b4e 18%,#454145 45%,#393839 75%,#313031 100%);box-shadow:inset 0 1px 0 #5e5d5e,inset -1px 0 0 #1a1a1a,inset 1px 0 0 #444}
.tile .slot{position:absolute;left:11px;top:8px;width:46px;height:5px;border-radius:3px;background:#161616;box-shadow:0 1px 0 #5a595a}
.tile .led{position:absolute;left:11px;top:7px;width:46px;height:6px;border-radius:3px;background:var(--led);box-shadow:0 0 9px 1px rgba(165,215,16,.7),inset 0 1px 0 #d4ff4a}
.tile svg{position:absolute;overflow:visible}
.ic{fill:var(--ic);stroke:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.ics{fill:none;stroke:var(--ic);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.lbl{position:absolute;left:0;right:0;text-align:center;color:var(--ic);font-weight:300}
</style></head>
<body><div id="card" data-state="orig">
 <div class="t time" id="time">0:00</div><div class="t day" id="day">Poniedziałek</div>
 <img id="boiler" src="boiler_original.png" alt="">
 <div class="t big" id="big">0.0</div><div class="t state" id="state">Wyłączony</div>
 <div class="pill"><span class="n t" id="out">0</span><span class="a t">AUTO</span></div>

 <!-- MENU -->
 <div class="tile" style="left:0"><svg width="68" height="75" viewBox="0 0 68 75"><g class="ics" stroke-width="2.2"><path d="M20 31h28M20 37h28M20 43h28"/></g></svg><div class="lbl" style="top:49px;font-size:10px;letter-spacing:.6px">MENU</div></div>
 <!-- PALIWO -->
 <div class="tile" style="left:69px"><div class="lbl" id="kg" style="top:3px;font-size:12px">180kg</div>
  <svg width="68" height="75" viewBox="0 0 68 75"><path class="ic" d="M17 32c0-1 .4-1.6 1.4-1.6h.8c.8 0 1.4.6 1.5 1.4l.4 8c.2 4 3.8 8.6 8 11.4 3.4 2.2 6 2.2 9.4 0 4.2-2.800 7.800-7.400 8-11.400l.4-8c.1-.8.7-1.400 1.500-1.400h.8c1 0 1.400.6 1.400 1.600l-.6 9c-.4 6.400-5 12-10.600 15.200-4.600 2.600-9 2.600-13.600 0C23 52 18.400 46.400 18 40z"/>
   <g fill="#e8e8ec" opacity=".95"><circle cx="25" cy="36" r="1.5"/><circle cx="29" cy="36" r="1.5"/><circle cx="33" cy="36" r="1.5"/><circle cx="37" cy="36" r="1.5"/><circle cx="41" cy="36" r="1.5"/><circle cx="25" cy="40" r="1.5"/><circle cx="29" cy="40" r="1.5"/><circle cx="33" cy="40" r="1.5"/><circle cx="37" cy="40" r="1.5"/><circle cx="41" cy="40" r="1.5"/><circle cx="27" cy="44" r="1.5"/><circle cx="31" cy="44" r="1.5"/><circle cx="35" cy="44" r="1.5"/><circle cx="39" cy="44" r="1.5"/><circle cx="29" cy="48" r="1.5"/><circle cx="33" cy="48" r="1.5"/><circle cx="37" cy="48" r="1.5"/><circle cx="31" cy="52" r="1.5"/><circle cx="35" cy="52" r="1.5"/></g></svg></div>
 <!-- PALNIK -->
 <div class="tile" style="left:138px"><i class="slot" id="slot-b"></i><i class="led" id="led-b" style="display:none"></i>
  <svg width="68" height="75" viewBox="0 0 68 75"><path class="ic" d="M12 1.500c.5 3.500-3 5-4.500 8.500C6 13.500 7.500 18.500 12 19.500c-2.200-2-1.800-4.500.4-6.800.4 2 1.800 3 3.300 2.600C16 17.500 15 19 12.500 20.500 17 20 19.500 16.500 19 13c-.4-3.500-3-5-4-8-1 1.500-2 2-3 1.500C11.500 5 12.500 3.500 12 1.500z" transform="translate(21 22) scale(1.45 1.65)"/>
   <g id="lock"><rect x="48" y="25" width="9" height="8" rx="1.500" fill="#e0182d"/><path d="M50 25v-2.500a2.500 2.500 0 0 1 5 0V25" fill="none" stroke="#e0182d" stroke-width="2"/></g></svg></div>
 <!-- CO1 -->
 <div class="tile" style="left:207px"><i class="slot" id="slot-c"></i><i class="led" id="led-c" style="display:none"></i>
  <svg width="68" height="75" viewBox="0 0 68 75"><g class="ic"><rect x="16" y="28" width="28" height="3" rx="1.500"/><rect x="16" y="49" width="28" height="3" rx="1.500"/><rect x="17" y="31" width="4.500" height="18" rx="1.500"/><rect x="23.500" y="31" width="4.500" height="18" rx="1.500"/><rect x="30" y="31" width="4.500" height="18" rx="1.500"/><rect x="36.500" y="31" width="4.500" height="18" rx="1.500"/><rect x="13" y="32" width="3.500" height="6" rx="1"/><rect x="13" y="42" width="3.500" height="6" rx="1"/></g></svg><div class="lbl" style="left:auto;right:6px;top:28px;font-size:16px;font-weight:300;text-align:left;width:9px">1</div></div>
 <div class="tile" style="left:276px"></div>
 <div class="tile" id="tile-cwu" style="left:345px"></div>
 <!-- ZASILANIE -->
 <div class="tile" style="left:414px"><i class="led" id="led-p"></i>
  <svg width="68" height="75" viewBox="0 0 68 75"><g class="ics" stroke-width="2.2"><path d="M34 24v22"/><path d="M26.500 31a16 16 0 1 0 15 0" /></g><g class="ic"><circle cx="43.500" cy="60" r="1.700"/><circle cx="48" cy="60" r="1.700"/><circle cx="52.500" cy="60" r="1.700"/></g></svg></div>
</div>
<script>
const S={orig:{time:'0:00',day:'Poniedziałek',big:'0.0',state:'Wyłączony',out:'0',kg:'180kg',lock:1,b:0,c:0},
 idle:{time:'14:32',day:'Środa',big:'66.9',state:'Wyłączony',out:'-2',kg:'7kg',lock:0,b:0,c:1},
 work:{time:'14:32',day:'Środa',big:'72.4',state:'Modulacja',out:'-2',kg:'94kg',lock:0,b:1,c:1}};
const s=S[(location.hash||'#orig').slice(1)]||S.orig;
for(const k of ['time','day','big','state','out'])document.getElementById(k).textContent=s[k];
document.getElementById('kg').textContent=s.kg;document.getElementById('lock').style.display=s.lock?'block':'none';
document.getElementById('led-b').style.display=s.b?'block':'none';document.getElementById('slot-b').style.display=s.b?'none':'block';
document.getElementById('led-c').style.display=s.c?'block':'none';document.getElementById('slot-c').style.display=s.c?'none':'block';
</script></body></html>
