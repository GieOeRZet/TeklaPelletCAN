<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karta glowna v3</title>
<style>
:root{--bg:#08080a;--line:#26262c;--panel:#121216;--panel2:#18181d;--acc:#ff7a1a;--acc2:#ffb066;--txt:#f4f4f5;--mut:#85858f;--ok:#4fe38a;--warn:#ffc233;--stby:#e9e9ee;--bad:#ff4d4d;--fs:"Inter","Roboto","Segoe UI","DejaVu Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#000;height:100%}
body{display:grid;place-items:center;font-family:var(--fs);color:var(--txt)}
#card{position:relative;width:480px;height:272px;overflow:hidden;background:radial-gradient(70% 90% at 62% 50%,#1a1a20 0%,var(--bg) 70%)}
/* naglowek */
.hdr{position:absolute;left:8px;right:10px;top:6px;height:30px;display:flex;align-items:center;gap:10px}
.menu{width:34px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);display:grid;place-items:center}
.menu svg{width:18px;height:18px;stroke:var(--stby);fill:none;stroke-width:1.8;stroke-linecap:round}
.day{font-size:14px;font-weight:600}.day small{display:block;font-size:10px;color:var(--mut);font-weight:500;letter-spacing:.4px;margin-top:1px}
.sp{flex:1}.clock{font-size:20px;font-weight:600;color:var(--acc2);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bell{width:15px;height:15px;opacity:.3}
/* szyna lewa */
.rail{position:absolute;left:8px;top:42px;width:68px;display:flex;flex-direction:column;gap:4px}
.btn{position:relative;height:32px;white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:linear-gradient(90deg,var(--panel2),var(--panel));display:flex;align-items:center;gap:6px;padding-left:12px;font-size:10px;color:var(--mut);overflow:hidden}
.btn svg{width:19px;height:19px;flex:none;stroke:var(--stby);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn .led{position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#2b2b31}
.btn .led.g{background:var(--ok);box-shadow:0 0 9px 1px rgba(79,227,138,.6)}
.btn .led.y{background:var(--warn);box-shadow:0 0 9px 1px rgba(255,194,51,.55)}
.btn .led.w{background:var(--stby);box-shadow:0 0 8px rgba(233,233,238,.4)}
.btn b{font-weight:700;color:var(--acc2);font-size:10.5px}
.btn.empty{border-style:dashed;border-color:#1c1c20;background:none}
.btn .lock{position:absolute;right:4px;bottom:3px;width:10px;height:10px;stroke:var(--bad);stroke-width:2.2}
.btn.on svg{stroke:var(--acc)}
.pwr{position:absolute;left:8px;bottom:8px;width:68px}
/* kociol z oryginalu (2D front) */
#boiler{position:absolute;left:92px;top:44px;height:220px;width:auto;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent 100%);filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
/* wskaznik */
.gauge{position:absolute;left:170px;top:36px;width:200px;height:200px}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.temp{font-size:56px;font-weight:300;letter-spacing:-1.5px;line-height:56px;font-variant-numeric:tabular-nums}
.temp sup{font-size:17px;color:var(--acc);margin-left:2px;vertical-align:top;position:relative;top:5px;letter-spacing:0;font-weight:400}
.state{margin-top:6px;font-size:16px;font-weight:600;color:var(--acc2)}
.sub{margin-top:2px;font-size:9px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase}
/* prawa kolumna */
.side{position:absolute;right:10px;top:44px;width:84px;display:flex;flex-direction:column;gap:6px}
.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:8px 10px}
.card .lb{font-size:9px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase}
.card .v{font-size:25px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}.card .v small{font-size:12px;color:var(--mut)}
.mode{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.9px;color:#0b0b0d;background:var(--acc);border-radius:6px;padding:3px 8px}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.78}}
body[data-state=work] .flameico{animation:fl 1.1s ease-in-out infinite}
</style></head>
<body data-state="idle"><div id="card">
 <div class="hdr"><div class="menu" data-action="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
  <div class="day" data-action="dialog:date" id="day">Środa<small>25 listopada</small></div><div class="sp"></div>
  <svg class="bell" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="dot"></i>
  <span class="clock" data-action="dialog:time">14:32</span></div>

 <div class="rail">
  <div class="btn" data-action="dialog:fuel"><i class="led"></i><svg viewBox="0 0 24 24"><path d="M4 5h16l-4 8v6H8v-6z"/></svg><b id="kg">7 kg</b></div>
  <div class="btn on" data-action="screen:PALNIK"><i class="led" id="l-b"></i><svg class="flameico" viewBox="0 0 24 24"><path d="M12 3c1 4-4 5-4 10a4 4 0 0 0 8 0c0-3-2-4-3-7-.5 1-1 1.5-1 1.5"/></svg><svg class="lock" id="lock" viewBox="0 0 24 24" style="display:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="btn on" data-action="screen:OGRZEWANIE1"><i class="led g" id="l-c1"></i><svg viewBox="0 0 24 24"><path d="M6 6v12M10 6v12M14 6v12M18 6v12M4 6h16M4 18h16"/></svg><b>1</b></div>
  <div class="btn empty" data-action="screen:OGRZEWANIE2"></div>
  <div class="btn on" data-action="screen:CWU"><i class="led" id="l-w"></i><svg viewBox="0 0 24 24"><path d="M5 9h8a3 3 0 0 1 3 3v1M5 9V6M9 6H5M16 13v3"/></svg></div>
 </div>
 <div class="btn pwr on" data-action="dialog:power"><i class="led g"></i><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7 6.5a8 8 0 1 0 10 0"/></svg></div>

 <img id="boiler" src="boiler_front.png" alt="kociol" data-action="screen:KOCIOL">

 <div class="gauge" data-action="screen:KOCIOL">
  <svg viewBox="0 0 200 200" width="200" height="200"><defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffc233"/></linearGradient></defs>
   <circle cx="100" cy="100" r="86" fill="none" stroke="#1d1d23" stroke-width="9" stroke-linecap="round" stroke-dasharray="405 540" transform="rotate(135 100 100)"/>
   <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="270 540" transform="rotate(135 100 100)" style="filter:drop-shadow(0 0 6px rgba(255,122,26,.55))"/>
   <g stroke="#34343c" stroke-width="1.5"><path d="M30 164l5-4M100 14v7M170 164l-5-4"/></g></svg>
  <div class="val"><div class="temp" id="t">66.9<sup>°C</sup></div><div class="state" id="st">Wyłączony</div><div class="sub" id="sub">tryb auto</div></div></div>

 <div class="side"><div class="card" data-action="dialog:mode"><div class="lb">zewn.</div><div class="v" id="out">-2<small>°C</small></div><span class="mode">AUTO</span></div></div>
</div>
<script>
const S={idle:{t:'66.9',a:.67,st:'Wyłączony',sub:'palnik · gotowość',out:'-2',kg:'7 kg',b:'',lock:0,w:'',c:'g'},
 work:{t:'72.4',a:.72,st:'Modulacja 63%',sub:'palnik pracuje',out:'-2',kg:'94 kg',b:'g',lock:0,w:'w',c:'g'},
 lock:{t:'58.0',a:.58,st:'Zakaz rozpalania',sub:'palnik zablokowany',out:'4',kg:'94 kg',b:'y',lock:1,w:'',c:'g'}};
function set(k){const s=S[k];document.body.dataset.state=k==='work'?'work':'idle';
 document.getElementById('t').innerHTML=s.t+'<sup>°C</sup>';document.getElementById('st').textContent=s.st;document.getElementById('sub').textContent=s.sub;
 document.getElementById('out').innerHTML=s.out+'<small>°C</small>';document.getElementById('kg').textContent=s.kg;
 document.getElementById('arc').setAttribute('stroke-dasharray',(405*s.a)+' 540');
 document.getElementById('l-b').className='led '+s.b;document.getElementById('lock').style.display=s.lock?'block':'none';
 document.getElementById('l-w').className='led '+s.w;document.getElementById('l-c1').className='led '+s.c;}
set((location.hash||'#idle').slice(1));
</script></body></html>
