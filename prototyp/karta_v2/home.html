<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karta glowna v2</title>
<style>
:root{--bg:#09090b;--bg2:#131316;--line:#26262b;--tile:#141417;--tile2:#1b1b20;--acc:#ff7a1a;--acc2:#ffb066;--txt:#f4f4f5;--mut:#8a8a93;--ok:#4fe38a;--warn:#ffc233;--stby:#e9e9ee;--bad:#ff4d4d;--fs:"Inter","Roboto","Segoe UI","DejaVu Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%}
body{display:grid;place-items:center;font-family:var(--fs);color:var(--txt)}
#card{position:relative;width:480px;height:272px;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#17171b 0%,var(--bg) 62%);border-radius:0}
/* gorny pasek */
.top{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;letter-spacing:.3px}
.top .clock{font-weight:600;color:var(--acc2);font-variant-numeric:tabular-nums}
.top .day{font-weight:600}.top .day small{color:var(--mut);font-weight:500;margin-left:8px;font-size:12px}
.top .st{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bell{width:15px;height:15px;opacity:.28}
/* kociol */
#boiler{position:absolute;left:18px;top:42px;width:128px;height:152px}
/* srodek */
.mid{position:absolute;left:150px;width:196px;top:52px;text-align:center}
.temp{font-size:84px;line-height:84px;font-weight:300;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.temp sup{font-size:26px;font-weight:400;color:var(--acc);vertical-align:top;position:relative;top:8px;margin-left:2px;letter-spacing:0}
.state{margin-top:6px;font-size:23px;font-weight:600;color:var(--acc2);letter-spacing:.4px}
.sub{margin-top:3px;font-size:12px;color:var(--mut);letter-spacing:.4px}
/* prawa kapsula */
.pill{position:absolute;right:12px;top:46px;width:116px;height:40px;border:1px solid var(--line);background:linear-gradient(180deg,var(--tile2),var(--tile));border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px}
.pill .out{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}.pill .out small{font-size:13px;color:var(--mut);margin-left:1px}
.pill .mode{font-size:10px;font-weight:700;letter-spacing:.8px;color:#0b0b0d;background:var(--acc);border-radius:5px;padding:3px 6px}
.cap{position:absolute;right:14px;top:90px;width:112px;text-align:right;font-size:9.5px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
/* dolna belka */
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:68px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--tile2),var(--tile));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--mut);overflow:hidden}
.tile svg{width:30px;height:30px;stroke:var(--stby);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile.empty{background:transparent;border-style:dashed;border-color:#1c1c20}
.tile .led{position:absolute;left:14%;right:14%;top:5px;height:3px;border-radius:3px;background:#2b2b31}
.tile .led.g{background:var(--ok);box-shadow:0 0 10px 1px rgba(79,227,138,.55)}
.tile .led.y{background:var(--warn);box-shadow:0 0 10px 1px rgba(255,194,51,.5)}
.tile .led.w{background:var(--stby);box-shadow:0 0 8px 0 rgba(233,233,238,.35)}
.tile .num{position:absolute;right:9px;top:17px;font-size:12px;font-weight:700;color:var(--acc2)}
.tile .val{font-size:11px;color:var(--txt);font-weight:600}
.tile.on svg{stroke:var(--acc)}
.tile .lock{position:absolute;right:11px;bottom:10px;width:13px;height:13px;stroke:var(--bad);stroke-width:2}
body[data-state=work] .flame{fill:var(--acc);stroke:var(--acc2)}
.flame{fill:none}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.78}}
body[data-state=work] #bflame{animation:flick 1.1s ease-in-out infinite}
</style></head>
<body data-state="idle">
<div id="card">
 <div class="top"><span class="clock" data-action="dialog:time">14:32</span><span class="day" data-action="dialog:date">Środa<small>25 listopada</small></span>
  <span class="st"><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="dot" title="CAN OK"></i></span></div>

 <!-- KOCIOL 2D, front -->
 <svg id="boiler" viewBox="0 0 128 152" data-action="screen:KOCIOL">
  <defs>
   <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#ee4a2a"/><stop offset="1" stop-color="#cf3a20"/></linearGradient>
   <linearGradient id="burn" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#e86a12"/></linearGradient>
   <pattern id="pel" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.3" fill="#c9792a"/></pattern>
   <radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- zasobnik -->
  <rect x="44" y="4" width="68" height="40" rx="5" fill="#26272c" stroke="#3a3b42"/>
  <rect x="48" y="9" width="60" height="31" rx="3" fill="#15161a"/>
  <rect id="fuel" x="48" y="24" width="60" height="16" rx="3" fill="url(#pel)" stroke="#d98a34" stroke-width=".8"/>
  <rect x="40" y="1" width="76" height="6" rx="3" fill="#3a3b42"/>
  <!-- korpus -->
  <rect x="38" y="42" width="80" height="102" rx="6" fill="url(#body)"/>
  <rect x="44" y="49" width="68" height="46" rx="4" fill="#00000026" stroke="#00000040"/>
  <rect x="48" y="53" width="60" height="38" rx="3" fill="#b82f1b"/>
  <rect x="97" y="68" width="6" height="10" rx="2" fill="#2a1410"/>
  <rect x="44" y="101" width="68" height="36" rx="4" fill="#00000026" stroke="#00000040"/>
  <rect x="48" y="105" width="60" height="28" rx="3" fill="#b82f1b"/>
  <rect x="97" y="114" width="6" height="10" rx="2" fill="#2a1410"/>
  <rect x="86" y="45" width="26" height="6" rx="2" fill="#0d0d10"/><circle cx="92" cy="48" r="1.6" fill="#4fe38a"/>
  <!-- podajnik zolty -->
  <rect x="17" y="40" width="9" height="76" rx="3" fill="#f1c232"/><rect x="17" y="40" width="3" height="76" rx="1.5" fill="#fff3" />
  <path d="M26 44 L44 36 L44 46 L26 52Z" fill="#d9a920"/>
  <!-- palnik -->
  <rect x="4" y="112" width="40" height="30" rx="6" fill="url(#burn)"/>
  <rect x="8" y="118" width="14" height="18" rx="3" fill="#00000030"/>
  <g id="bflame" opacity="0"><circle cx="26" cy="127" r="14" fill="url(#glow)"/><path d="M30 118c3 5-3 6-3 11a5 5 0 0 0 10 0c0-3-2-4-3-7-1 1-2 2-3 1z" fill="#ffd27a"/></g>
  <rect x="28" y="140" width="76" height="6" rx="2" fill="#1b1b1f"/>
 </svg>

 <div class="mid">
  <div class="temp" id="t">66.9<sup>°C</sup></div>
  <div class="state" id="st">Wyłączony</div>
  <div class="sub" id="sub">KOCIOŁ WŁĄCZONY · TRYB AUTO</div>
 </div>
 <div class="pill" data-action="dialog:mode"><span class="out" id="out">-2<small>°C</small></span><span class="mode">AUTO</span></div>
 <div class="cap">zewn. · tryb</div>

 <div class="bar">
  <div class="tile" data-action="menu"><i class="led"></i>
   <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>MENU</span></div>
  <div class="tile" data-action="dialog:fuel"><i class="led"></i><span class="val" id="fuel-kg">7 kg</span>
   <svg viewBox="0 0 24 24"><path d="M4 5h16l-4 8v6H8v-6z"/><path d="M9 14h6" stroke-dasharray="1 2"/></svg></div>
  <div class="tile on" data-action="screen:PALNIK"><i class="led" id="led-burner"></i>
   <svg viewBox="0 0 24 24"><path class="flame" d="M12 3c1 4-4 5-4 10a4 4 0 0 0 8 0c0-3-2-4-3-7-.5 1-1 1.5-1 1.5"/></svg>
   <svg class="lock" id="lock" viewBox="0 0 24 24" style="display:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="tile on" data-action="screen:OGRZEWANIE1"><i class="led g" id="led-co1"></i>
   <svg viewBox="0 0 24 24"><path d="M6 6v12M10 6v12M14 6v12M18 6v12M4 6h16M4 18h16"/></svg><span class="num">1</span></div>
  <div class="tile empty" data-action="screen:OGRZEWANIE2"><i class="led" style="opacity:.0"></i></div>
  <div class="tile on" data-action="screen:CWU"><i class="led" id="led-cwu"></i>
   <svg viewBox="0 0 24 24"><path d="M5 9h8a3 3 0 0 1 3 3v1M5 9V6M9 6H5M16 13v3"/><circle cx="16" cy="19" r=".8" fill="currentColor"/></svg></div>
  <div class="tile on" data-action="dialog:power"><i class="led g" id="led-pwr"></i>
   <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7 6.5a8 8 0 1 0 10 0"/></svg></div>
 </div>
</div>
<script>
const S={idle:{t:'66.9',st:'Wyłączony',sub:'KOCIOŁ WŁĄCZONY · TRYB AUTO',out:'-2',kg:'7 kg',fuel:16,burner:'',flame:0,lock:0,cwu:'',co:'g'},
 work:{t:'72.4',st:'Modulacja 63%',sub:'PALNIK PRACUJE · TRYB AUTO',out:'-2',kg:'94 kg',fuel:42,burner:'g',flame:1,lock:0,cwu:'w',co:'g'},
 lock:{t:'58.0',st:'Wyłączony',sub:'ZAKAZ ROZPALANIA',out:'4',kg:'94 kg',fuel:42,burner:'y',flame:0,lock:1,cwu:'',co:'g'}};
function set(k){const s=S[k];document.body.dataset.state=k==='work'?'work':'idle';
 document.getElementById('t').innerHTML=s.t+'<sup>°C</sup>';document.getElementById('st').textContent=s.st;document.getElementById('sub').textContent=s.sub;
 document.getElementById('out').innerHTML=s.out+'<small>°C</small>';document.getElementById('fuel-kg').textContent=s.kg;
 const f=document.getElementById('fuel');f.setAttribute('y',40-s.fuel);f.setAttribute('height',s.fuel);
 document.getElementById('led-burner').className='led '+s.burner;document.getElementById('bflame').setAttribute('opacity',s.flame);
 document.getElementById('lock').style.display=s.lock?'block':'none';document.getElementById('led-cwu').className='led '+s.cwu;document.getElementById('led-co1').className='led '+s.co;}
set((location.hash||'#idle').slice(1));
</script></body></html>
